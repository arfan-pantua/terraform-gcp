name: 'Terraform Plan'


on:
  pull_request:
    types:
      - "edited"
      - "opened"
      - "ready_for_review"
      - "reopened"
      - "synchronize"
      - "unlocked"

permissions:
  actions: write
  contents: read
  id-token: write # Required for GCP Workload Identity Federation
  issues: write
  pull-requests: write # Required to post plan comments on the PR

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Authenticate to GCP using WIF
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/917138085830/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'terraform-runner@project-9ab7f4b3-59fb-4c35-846.iam.gserviceaccount.com'
      - name: Configure Git Credentials
        run: |
          git config --global url."https://oauth2:${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}@github.com".insteadOf "https://github.com"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      # 2. Terraform Plan (Only on Pull Request)
      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        id: plan
        run: terraform plan -no-color
        continue-on-error: true

      # 3. Post Plan to PR (Helpful for visibility)
      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📖 \`${{ steps.plan.outcome }}\`
            <details><summary>Show Plan</summary>
            
            \`\`\`hcl
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            
            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })