name: 'Terraform Plan'


on:
  pull_request:
    types:
      - "edited"
      - "opened"
      - "ready_for_review"
      - "reopened"
      - "synchronize"
      - "unlocked"

permissions:
  actions: write
  contents: read
  id-token: write # Required for GCP Workload Identity Federation
  issues: write
  pull-requests: write # Required to post plan comments on the PR

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    

    steps:
      # 1. Authenticate to GCP using WIF
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/917138085830/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'terraform-runner@project-9ab7f4b3-59fb-4c35-846.iam.gserviceaccount.com'
      - name: Configure Git Credentials
        run: |
          git config --global url."https://oauth2:${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}@github.com".insteadOf "https://github.com"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # --- Setup Terraform / Init steps here ---
      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        id: plan
        # We redirect output to a file and then to stdout for the script to catch
        run: |
          terraform plan -no-color -out=tfplan
          terraform show -no-color tfplan > plan_output.txt
          cat plan_output.txt
        continue-on-error: true

      # 3. Post Plan to PR
      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan_output.txt', 'utf8');
            const maxLen = 60000;
            const trimmedPlan = plan.length > maxLen ? plan.substring(0, maxLen) + "\n...plan truncated..." : plan;
            
            const output = `#### Terraform Plan 📖 \`${{ steps.plan.outcome }}\`
            **Commit SHA:** \`${{ github.event.pull_request.head.sha }}\`
            
            <details><summary>Show Plan</summary>
            
            \`\`\`hcl
            ${trimmedPlan}
            \`\`\`
            
            </details>
            
            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
